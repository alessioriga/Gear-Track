<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GearTrack - Equipment Loans</title>
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/components.css" />
  </head>

  <body>
    <header class="app-header">
      <h1>GearTrack Department Manager</h1>
    </header>

    <main class="dashboard">
      <!-- GT-107: Display department equipment usage statistics. -->
      <section class="stats-section" aria-label="Department usage statistics">
        <section class="stats-grid">
          <article class="stat-card">
            <h2>Total Items</h2>
            <p id="stat-total-items">0</p>
          </article>

          <article class="stat-card">
            <h2>Currently Loaned (%)</h2>
            <p id="stat-currently-loaned">0%</p>
          </article>

          <article class="stat-card">
            <h2>Overdue Items</h2>
            <p id="stat-overdue-items">0</p>
          </article>
        </section>
      </section>

      <!-- GT-107: Switch between List and Chart views. -->
      <section class="panel usage-section" aria-labelledby="usage-heading">
        <h2 id="usage-heading">Equipment Usage by Category</h2>

        <p>Total loans, including returned equipment.</p>

        <fieldset class="view-toggle">
          <legend class="visually-hidden">Choose statistics view</legend>
          <input
            type="radio"
            name="usage-view"
            id="view-list"
            value="list checked"
          />
          <label for="view-list">List</label>

          <input type="radio" name="usage-view" id="view-chart" value="chart" />
          <label for="view-chart">Chart</label>
        </fieldset>
        <!-- List View: Display category usage as a table. -->
        <table id="usage-table">
          <thead>
            <tr>
              <th scope="col">Category</th>
              <th scope="col">Total Loans</th>
            </tr>
          </thead>

          <tbody id="usage-list"></tbody>
        </table>

        <!-- Bar Chart View: Display the same data using Chart.js. -->
        <section
          id="usage-chart-panel"
          aria-label="Equipment usage bar chart"
          hidden
        >
          <canvas id="usage-chart"></canvas>
        </section>
      </section>
      <section class="panel">
        <h2>Available Equipment</h2>
        <!-- GT-102: Equipment Category Filtering (it provides a dropdown menu allowing users to filter equipment by category or display all equipment). -->
        <label for="category-filter">Filter by category:</label>
        <select id="category-filter">
          <option value="all">All Categories</option>
          <option value="Cameras">Cameras</option>
          <option value="Accessories">Accessories</option>
          <option value="Laptops">Laptops</option>
        </select>
        <ul id="equipment-list" class="item-list"></ul>
      </section>

      <section class="panel">
        <h2>Active Loans</h2>
        <!-- GT-105: Display the number of overdue active loans. -->
        <span id="overdue-counter" class="overdue-counter" aria-live="polite">
          0 Overdue Loans
        </span>
        <section id="active-loans-list" class="item-list"></section>
      </section>
    </main>
    <!-- GT-101: Checkout Form Modal (it allows staff to enter borrower details when checking out equipment). -->
    <dialog id="checkout-modal">
      <h2>Checkout Equipment</h2>

      <form id="checkout-form">
        <label for="borrower-name">Borrower Name:</label>
        <input type="text" name="borrowerName" id="borrower-name" required />

        <label for="borrower-email">Borrower Email:</label>
        <input
          type="email"
          name="borrower-email"
          id="borrower-email"
          required
        />

        <label for="return-date">Return Date:</label>
        <input type="date" name="dueDate" id="return-date" required />

        <button type="submit">Confirm Checkout</button>
        <button type="button" id="cancel-checkout">Cancel</button>
      </form>
    </dialog>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
