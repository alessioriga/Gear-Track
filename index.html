<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GearTrack - Equipment Loans</title>
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/components.css" />
  </head>

  <body>
    <header class="app-header">
      <h1>GearTrack Department Manager</h1>
    </header>

    <main class="dashboard">
      <section class="panel">
        <h2>Available Equipment</h2>
        <!-- GT-102: Equipment Category Filtering (it provides a dropdown menu allowing users to filter equipment by category or display all equipment). -->
        <label for="category-filter">Filter by category:</label>
        <select id="category-filter">
          <option value="all">All Categories</option>
          <option value="Cameras">Cameras</option>
          <option value="Accessories">Accessories</option>
          <option value="Laptops">Laptops</option>
        </select>
        <ul id="equipment-list" class="item-list"></ul>
      </section>

      <section class="panel">
        <h2>Active Loans</h2>
        <!-- GT-105: Display the number of overdue active loans. -->
        <span id="overdue-counter" class="overdue-counter" aria-live="polite">
          0 Overdue Loans
        </span>
        
        <div id="active-loans-list" class="item-list"></div>
      </section>
    </main>
    <!-- GT-101: Checkout Form Modal (it allows staff to enter borrower details when checking out equipment). -->
     <dialog id="checkout-modal">
      <h2>Checkout Equipment</h2>

      <form id="checkout-form">
        <label for="borrower-name">Borrower Name:</label>
        <input type="text" name="borrowerName" id="borrower-name" required>

        <label for="borrower-email">Borrower Email:</label>
        <input type="email" name="borrower-email" id="borrower-email" required>

        <label for="return-date">Return Date:</label>
        <input type="date" name="dueDate" id="return-date" required>

        <button type="submit">Confirm Checkout</button>
        <button type="button" id="cancel-checkout">Cancel</button>
      </form>
     </dialog>


    <script type="module" src="js/app.js"></script>
  </body>
</html>
